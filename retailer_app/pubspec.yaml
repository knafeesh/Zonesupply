name: retailer_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../core

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  badges: ^3.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  google_sign_in: ^6.2.1
  pinput: ^5.0.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
