version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: zonesupply_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zonesupply_db
      POSTGRES_USER: zonesupply_user
      POSTGRES_PASSWORD: zonesupply_pass
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zonesupply_user -d zonesupply_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zonesupply_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
